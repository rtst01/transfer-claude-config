name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-13, macos-latest, windows-latest]
        # macos-13 = x64, macos-latest = arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: e2e tests
        run: node test/e2e.js
      - name: Build SEA binary
        run: node scripts/build-sea.js
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.os }}
          path: dist/ccsync-*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: Checksums
        run: cd dist && sha256sum ccsync-* > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ccsync-*
            dist/SHA256SUMS.txt
          generate_release_notes: true
